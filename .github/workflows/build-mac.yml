
```yaml
name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller installieren
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Python-Programm bauen
        run: |
          pyinstaller --windowed --name USBDeviceMac usb_device_mac.py

      - name: DMG erstellen
        run: |
          mkdir dmg
          cp -R "dist/USBDeviceMac.app" dmg/
          hdiutil create \
            -volname "USBDeviceMac" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            "USBDeviceMac.dmg"

      - name: DMG als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: USBDeviceMac-macOS
          path: USBDeviceMac.dmg
```
